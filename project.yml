name: CloudMusicPlayer
options:
  bundleIdPrefix: com.samvel.cloudmusicplayer.V7J345DY58
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: "0.4.9"
targets:
  CloudMusicPlayer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
        excludes:
          - Widget/PlayerWidget.swift
          - Widget/PlayerWidgetIntents.swift
          - Widget/Info.plist
    dependencies:
      - package: YouTubeKit
      - target: CloudMusicPlayerWidget
        embed: true
        link: false
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: CloudPlayer
        CFBundleDisplayName: CloudPlayer
        CFBundleIdentifier: com.samvel.cloudmusicplayer.V7J345DY58
        CFBundleVersion: "6"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: CloudMusicPlayer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleIconName: AppIcon
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        NSAppleMusicUsageDescription: "Разрешите доступ к медиатеке для прослушивания локальных аудиофайлов и треков Apple Music."
    settings:
      SWIFT_VERSION: "5.9"
      PRODUCT_BUNDLE_IDENTIFIER: com.samvel.cloudmusicplayer.V7J345DY58
      ALWAYS_SEARCH_USER_PATHS: "NO"
      PRODUCT_NAME: CloudMusicPlayer
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_PRIMARY_APPICON_SET_NAME: AppIcon
      ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
      DEVELOPMENT_TEAM: V7J345DY58
      CODE_SIGN_STYLE: Automatic
      CODE_SIGNING_REQUIRED: "YES"
      CODE_SIGNING_ALLOWED: "YES"
      GENERATE_INFOPLIST_FILE: "NO"
      INFOPLIST_FILE: Sources/Info.plist
      INFOPLIST_KEY_NSAppleMusicUsageDescription: "Разрешите доступ к медиатеке для прослушивания локальных аудиофайлов и треков Apple Music."

  CloudMusicPlayerWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/Widget
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleName: CloudMusicPlayerWidget
        CFBundleDisplayName: Player Widget
        CFBundleIdentifier: com.samvel.cloudmusicplayer.V7J345DY58.widget
        CFBundleVersion: "6"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: "XPC!"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      SWIFT_VERSION: "5.9"
      PRODUCT_BUNDLE_IDENTIFIER: com.samvel.cloudmusicplayer.V7J345DY58.widget
      PRODUCT_NAME: CloudMusicPlayerWidget
      SKIP_INSTALL: "YES"
      APPLICATION_EXTENSION_API_ONLY: "YES"
      DEVELOPMENT_TEAM: V7J345DY58
      CODE_SIGN_STYLE: Automatic
      CODE_SIGNING_REQUIRED: "YES"
      CODE_SIGNING_ALLOWED: "YES"
      GENERATE_INFOPLIST_FILE: "NO"
      INFOPLIST_FILE: Sources/Widget/Info.plist
